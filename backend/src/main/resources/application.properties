spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=${GAMESHELF_JWT_SECRET:Z2FtZXNoZWxmLWRldmVsb3BtZW50LWtleS1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVzIQ==}
app.jwt.expiration-ms=1800000
