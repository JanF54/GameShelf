spring.application.name=gameshelf-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/gameshelf;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
